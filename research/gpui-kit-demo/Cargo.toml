[package]
name = "c2a-gpui-demo"
version = "0.3.0"
edition = "2024"
publish = false
description = "Research demo: c2a review app (video review, image canvas, AI operations) on GPUI Kit"
license = "Apache-2.0"

[[bin]]
name = "c2a-review"
path = "src/main.rs"

[dependencies]
libc = "0.2"
gpui-kit = "0.9.0"
# The media engine without its GPUI layer (alhazen-gpui pins gpui 0.2.2; see NOTES.md).
alhazen-core = { version = "0.7.1", default-features = false, features = ["native", "audio-output", "ffmpeg-cli", "nvdec", "native-aac", "native-mp3"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ureq = { version = "2", features = ["json"] }
serde_json = "1"
anyhow = "1"
url = "2"

[profile.dev.package."*"]
opt-level = 2  # decoders are unusably slow unoptimized
