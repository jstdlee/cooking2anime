# cooking2anime — default config (v2). Validated by c2a/config.py; unknown keys are errors.
# Per-run choices (style layers, clip lengths, audio mode) are made in the Studio or with
# `c2a style/clips/audio` and stored in the run, overriding these defaults.

run:
  workdir: runs
  commercial: false
  stack: cloud
output:
  resolution: 720p
  fps: 24
  codec: h264
  crf: 18
ingest:
  shot_detector: ffmpeg_scene
  gen_fps: 16
keys:
  sensitivity: 0.7
  min_gap_s: 0.75
  max_gap_s: 5.0
  refine_s: 0.25
  auto_check_min: 0.6
  analysis_width: 128
tag:
  vlm: cloud_vlm
  sample_fps: 4
style:
  selection:
    animation: theatrical_anime
    director: food_commercial
    finish: grain_35mm
    custom_prompt: ''
    custom_negative: ''
  preview:
    sample_keys: 3
    seeds_per_key: 3
clips:
  length_mode: match
  fixed_s: 3.0
  min_clip_s: 1.0
  max_clip_s: 5.0
  anchor_end: true
  per_clip: {}
generate:
  model: wan_i2v_14b
  backend: fal  # fal | comfyui (your own GPU: providers.comfyui)
  max_retries: 2
qa:
  min_style_sim: 0.8
  min_structure_ssim: 0.35
  min_boundary_ssim: 0.9
  min_motion_match: 0.7
  max_flicker: 0.05
  max_text_boxes: 0
post:
  interpolate: rife
  upscaler: seedvr2
audio:
  mode: regenerate
  sfx:
    enabled: true
    provider: hunyuan_foley
  voice:
    enabled: true
    provider: fish_api
    model: drama-3
    reference_id: null
    min_intensity: 2
    min_gap_s: 4.0
    gain_db: -6.0
    word_guard: true
  keep_voice:
    stretch_tolerance: 0.15
    fade_ms: 80
    crossfade_ms: 40
    phrase_gap_s: 0.3
    duck_db: 8.0
    foley_under: true
  loudness_lufs: -14.0
  true_peak_dbtp: -1.0
studio:
  host: 127.0.0.1
  port: 8765
  open_browser: true
providers:
  comfyui:
    # a ComfyUI server with Wan 2.2 (scripts/comfyui/setup_wan22.sh)
    url: http://127.0.0.1:8188
    timeout_s: 1800
    resolution: 480p
    wan_high_noise: wan2.2_i2v_high_noise_14B_fp8_scaled.safetensors
    wan_low_noise: wan2.2_i2v_low_noise_14B_fp8_scaled.safetensors
    text_encoder: umt5_xxl_fp8_e4m3fn_scaled.safetensors
    vae: wan_2.1_vae.safetensors
    steps: 20
    cfg: 3.5
    shift: 8.0
    sampler: euler
    scheduler: simple
  fal:
    api_key_env: FAL_KEY
    max_parallel: 6
    timeout_s: 900
    # fal.ai model ids (https://fal.ai/models); any model with the same inputs works
    image_edit: fal-ai/nano-banana/edit
    video: fal-ai/wan/v2.2-a14b/image-to-video
    video_resolution: 480p
    foley: fal-ai/mmaudio-v2
    asr: fal-ai/wizper
    separator: fal-ai/demucs
  fish:
    api_key_env: FISH_API_KEY
    base_url: https://api.fish.audio
    local_url: http://127.0.0.1:8080
  cloud_vlm:
    # any OpenAI-compatible chat API with image input (Gemini, OpenAI, OpenRouter, Qwen,
    # a local Ollama or vLLM server...)
    api_key_env: GEMINI_API_KEY
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    model: gemini-2.5-flash
    timeout_s: 120
    max_frames: 6
    ocr: true
