# cooking2anime — example pipeline config (schema planned in c2a/config.py)
# Everything is prompt-driven: no text/logo detection, no pose extraction.

run:
  workdir: runs
  commercial: false

output:
  resolution: 720p           # 720p | 1080p (1080p adds an upscale stage)
  fps: 24
  codec: h264                # h264 | h265
  crf: 18

analyze:
  shot_detector: transnetv2  # transnetv2 | pyscenedetect
  chunk_seconds: 5           # lower (e.g. 3) for fast actions
  transcribe: true

describe:
  vlm: local_qwen_vl         # local_qwen_vl | gemini | claude | openai_compat
  fields: [subjects, setting, food_state, action_beats, gestures, emotion, camera, sound_cues]
  ignore_overlays: true      # don't describe on-screen text, logos, watermarks

style:
  preset: shinkai_food       # configs/styles/<preset>.yaml
  prompt: >
    Japanese anime cooking scene, cinematic Shinkai-style lighting, painterly
    background, highly detailed glossy food, shallow depth of field, soft film
    grain, professional photography composition
  clean_prompt: "clean image, no text, no logo, no watermark, no subtitles"
  negative: >
    text, letters, subtitles, captions, watermark, logo, signature, UI,
    blurry, deformed hands, extra fingers, low quality, flicker
  realism: 0.45              # 0 = pure anime, 1 = near-photographic
  lora: []                   # e.g. [{name: anime_food_v2, weight: 0.8}]
  preview:
    sample_keyframes: 4
    seeds_per_keyframe: 3

generate:
  provider: comfyui          # comfyui | fal | replicate
  model: wan_flf2v_14b       # first-last-frame image-to-video
  anchor: first_last         # first_last | first_only
  motion_control: none       # none | pose (fallback only for shots QA keeps flagging)
  qa:
    judge: local_qwen_vl
    min_motion_match: 0.7
    min_style_sim: 0.80
    reject_visible_text: true
    max_retries: 2

post:
  interpolate: rife
  upscaler: seedvr2          # used only for 1080p
  lut: null
  film_grain: 0.15

audio:
  foley:
    provider: local_hunyuan_foley   # local_hunyuan_foley | local_mmaudio | controlfoley | fal
    prompt_from: sound_cues         # VLM sound cues per shot
    extra_prompt: "kitchen ambience"
  narration:
    enabled: true
    language: ja
    script_llm: claude       # claude | local_qwen | openai_compat
    tts:
      provider: fish_api     # fish_api | fish_local
      model: drama-3         # drama-3 | s2-pro
      reference_id: null     # Fish voice id (only voices you have rights to)
  bgm:
    enabled: false
  loudness_lufs: -14

providers:
  comfyui:
    url: http://127.0.0.1:8188   # can point at a remote GPU box
  fal:
    api_key_env: FAL_KEY
  replicate:
    api_key_env: REPLICATE_API_TOKEN
  fish:
    api_key_env: FISH_API_KEY
    base_url: https://api.fish.audio
    local_url: http://127.0.0.1:8080
  llm:
    anthropic_api_key_env: ANTHROPIC_API_KEY
    gemini_api_key_env: GEMINI_API_KEY
    openai_compat_url: http://127.0.0.1:11434/v1
