# cooking2anime — default config (v2). Validated by c2a/config.py; unknown keys are errors.
# Per-run choices (style layers, clip lengths, audio mode) are made in the Studio or with
# `c2a style/clips/audio` and stored in the run, overriding these defaults.

run:
  workdir: runs
  commercial: false
  stack: local
output:
  resolution: 720p
  fps: 24
  codec: h264
  crf: 18
ingest:
  shot_detector: transnetv2
  gen_fps: 16
keys:
  sensitivity: 0.7
  min_gap_s: 0.75
  max_gap_s: 5.0
  refine_s: 0.25
  auto_check_min: 0.6
  analysis_width: 128
tag:
  vlm: qwen_vl
  sample_fps: 4
style:
  selection:
    animation: theatrical_anime
    director: food_commercial
    finish: grain_35mm
    custom_prompt: ''
    custom_negative: ''
  preview:
    sample_keys: 3
    seeds_per_key: 3
clips:
  length_mode: match
  fixed_s: 3.0
  min_clip_s: 1.0
  max_clip_s: 5.0
  anchor_end: true
  per_clip: {}
generate:
  model: wan_i2v_14b
  max_retries: 2
qa:
  min_style_sim: 0.8
  min_structure_ssim: 0.35
  min_boundary_ssim: 0.9
  min_motion_match: 0.7
  max_flicker: 0.05
  max_text_boxes: 0
post:
  interpolate: rife
  upscaler: seedvr2
audio:
  mode: regenerate
  sfx:
    enabled: true
    provider: hunyuan_foley
  voice:
    enabled: true
    provider: fish_api
    model: drama-3
    reference_id: null
    min_intensity: 2
    min_gap_s: 4.0
    gain_db: -6.0
    word_guard: true
  keep_voice:
    stretch_tolerance: 0.15
    fade_ms: 80
    crossfade_ms: 40
    phrase_gap_s: 0.3
    duck_db: 8.0
    foley_under: true
  loudness_lufs: -14.0
  true_peak_dbtp: -1.0
studio:
  host: 127.0.0.1
  port: 8765
  open_browser: true
providers:
  comfyui:
    url: http://127.0.0.1:8188
  fal:
    api_key_env: FAL_KEY
    max_parallel: 6
  fish:
    api_key_env: FISH_API_KEY
    base_url: https://api.fish.audio
    local_url: http://127.0.0.1:8080
  cloud_vlm:
    api_key_env: GEMINI_API_KEY
