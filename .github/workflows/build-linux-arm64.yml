name: build linux-arm64

# Release artifacts for linux/arm64 (e.g. NVIDIA DGX Spark / Jetson / Graviton):
#   - c2a-<version>-linux-arm64.tar.gz (+ .sha256): self-contained CLI + Studio (PyInstaller),
#     smoke-tested (a full fake-stack run, then the Studio page and API)
#   - cooking2anime-<version>-py3-none-any.whl: the same, as a Python package
# The c2a binary is built natively when the repository variable ARM64_RUNNER names an
# arm64 runner; otherwise inside an arm64 Ubuntu 22.04 container under QEMU.
# On a `v*` tag push, or a manual run with `release_tag` set (the release job then
# creates the tag at the built commit), the artifacts are attached to a GitHub release.

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v0.2.0; must match the package version)"
        required: false
        default: ""

jobs:
  frontend:
    name: Studio frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - working-directory: studio
        run: npm ci --no-audit --no-fund && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: studio-static
          path: c2a/studio/static
          if-no-files-found: error

  c2a:
    name: c2a binary (linux-arm64)
    needs: frontend
    runs-on: ${{ vars.ARM64_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: studio-static
          path: c2a/studio/static

      - uses: actions/setup-python@v5
        if: runner.arch == 'ARM64'
        with:
          python-version: "3.12"

      - name: Native arm64 build
        if: runner.arch == 'ARM64'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          packaging/build_binary.sh dist

      - name: Set up QEMU
        if: runner.arch != 'ARM64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Emulated arm64 build (Ubuntu 22.04, glibc 2.35)
        if: runner.arch != 'ARM64'
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD:/src" -w /src \
            -e DEBIAN_FRONTEND=noninteractive ubuntu:22.04 bash -euo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq software-properties-common >/dev/null
              add-apt-repository -y ppa:deadsnakes/ppa >/dev/null
              apt-get update -qq
              apt-get install -y -qq python3.12 python3.12-venv python3.12-dev \
                ffmpeg binutils >/dev/null
              ln -sf /usr/bin/python3.12 /usr/local/bin/python3
              ln -sf /usr/bin/python3.12 /usr/local/bin/python
              packaging/build_binary.sh dist
              chown -R '"$(id -u):$(id -g)"' dist'

      - name: Check architecture
        run: |
          ls -la dist
          tar -xzf dist/c2a-*-linux-arm64.tar.gz -C "$RUNNER_TEMP"
          file "$RUNNER_TEMP"/c2a-*-linux-arm64/c2a | tee /dev/stderr | grep -q "ARM aarch64"

      - uses: actions/upload-artifact@v4
        with:
          name: c2a-linux-arm64
          path: dist/c2a-*-linux-arm64.tar.gz*
          if-no-files-found: error

  wheel:
    name: wheel
    needs: frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: studio-static
          path: c2a/studio/static
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install build
          python -m build --wheel --outdir dist
          unzip -l dist/*.whl | grep -q "c2a/studio/static/index.html"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [c2a, wheel]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "{c2a-linux-arm64,wheel}"
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag: $TAG"; exit 1; }
          VERSION="$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          [ "v$VERSION" = "$TAG" ] || { echo "tag $TAG != package version $VERSION"; exit 1; }
          ls -la dist
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "cooking2anime $TAG" --generate-notes
