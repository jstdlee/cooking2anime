name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # Add an arm64 runner by setting the repository variable ARM64_RUNNER
        # (e.g. ubuntu-24.04-arm for public repos, or a larger/self-hosted runner label).
        runner: ${{ fromJSON(vars.ARM64_RUNNER && format('["ubuntu-24.04","{0}"]', vars.ARM64_RUNNER) || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Studio frontend (type-check + build into the package)
        working-directory: studio
        run: npm ci --no-audit --no-fund && npm run build

      - name: Python deps
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check c2a tests tools

      - name: Types
        run: mypy

      - name: Tests (unit, property, integration, Studio API, CLI)
        run: python -m pytest tests -q -n auto --cov --cov-report=json:coverage.json -p no:cacheprovider

      - name: Coverage gates
        run: python tools/coverage_gate.py coverage.json

      - name: Studio end-to-end (Playwright, real server, fake stack)
        working-directory: studio
        env:
          C2A_PYTHON: python
        run: |
          npx playwright install --with-deps chromium >/dev/null
          npx playwright test

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ matrix.runner }}
          path: |
            studio/test-results
            coverage.json
          if-no-files-found: ignore
          retention-days: 14
