[project]
name = "cooking2anime"
version = "0.3.0"
description = "Remake cooking videos as Japanese anime: prompt-driven, one human approval on a GoDraw canvas."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6",
    "numpy>=1.26",
    "pillow>=10",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=12",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-socket>=0.7",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pyinstaller>=6.10",
    "httpx>=0.27",
    "pytest-xdist>=3.6",
]

[project.scripts]
c2a = "c2a.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["c2a*"]

[tool.setuptools.package-data]
c2a = ["prompts/*.yaml", "styles/*/*.yaml", "studio/static/*", "studio/static/assets/*",
       "studio/static/assets/*/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF007"]

[tool.ruff.lint.per-file-ignores]
"c2a/studio/server.py" = ["B008"]  # FastAPI's File()/Form() defaults are the idiom

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["c2a"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--disable-socket --allow-unix-socket -ra"
testpaths = ["tests"]
markers = [
    "gpu: needs a GPU and real models (nightly only)",
    "godraw: needs a built GoDraw binary and a display",
]

[tool.coverage.run]
source = ["c2a"]
branch = true
